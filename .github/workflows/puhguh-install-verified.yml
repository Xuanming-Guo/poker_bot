name: Install verified Puhguh artifacts
on:
  push:
    paths:
      - '.github/workflows/puhguh-install-verified.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy checksum-verified existing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          repo = "Xuanming-Guo/poker_bot"
          api = "https://api.github.com/repos/" + repo
          token = os.environ["GH_TOKEN"]
          def request(path, data=None, method=None):
              body = None if data is None else json.dumps(data).encode()
              headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "puhguh-verified-artifact"}
              req = urllib.request.Request(api + path, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          source = "https://raw.githubusercontent.com/Xuanming-Guo/poker-bot-puhguh/51e476b04e132465d0979aa82e6f6ffb46dcc263/"
          expected = {
              "model.py": (120862, "958039d9f09d684fd7b76418cbb1faf2dc548a19830640a6e10901cd1a841a8a"),
              "puhguh.pkl": (45562, "c14ab2edf6afeda7bf433e6576f1dd10ede7247676dec62a54e74aee85492099")
          }
          entries = []
          for name, (size, digest) in expected.items():
              with urllib.request.urlopen(source + name, timeout=60) as response:
                  content = response.read()
              assert len(content) == size and hashlib.sha256(content).hexdigest() == digest, "Artifact mismatch: " + name
              blob = request("/git/blobs", {"content": base64.b64encode(content).decode(), "encoding": "base64"}, "POST")
              entries.append({"path": name, "mode": "100644", "type": "blob", "sha": blob["sha"]})
              print(name, len(content), hashlib.sha256(content).hexdigest())
          head = request("/git/ref/heads/main")["object"]["sha"]
          tree = request("/git/commits/" + head)["tree"]["sha"]
          new_tree = request("/git/trees", {"base_tree": tree, "tree": entries}, "POST")["sha"]
          commit = request("/git/commits", {"message": "Install verified Puhguh model and binary pickle", "tree": new_tree, "parents": [head]}, "POST")["sha"]
          request("/git/refs/heads/main", {"sha": commit, "force": False}, "PATCH")
          print("Verified source/pickle pair committed atomically:", commit)
          PY
